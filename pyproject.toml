[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-signal-copilot"
version = "0.1.0"
description = "Research-only clinical/biomedical signal DS+AIML copilot: SSL → detection → conformal → fairness (NOT a medical device)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rohith Vairavel" }]
keywords = ["biomedical-signals", "self-supervised-learning", "conformal-prediction", "fairness", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
ui = ["streamlit>=1.28", "jinja2>=3.1"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
csc-case-studies = "clinical_signal_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["clinical_signal_copilot"]
